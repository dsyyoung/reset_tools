<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RESET Data Viewer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 1rem;">
      <h1 style="margin: 0; font-size: 1.75rem; font-weight: 800; color: #0f172a;">RESET Data Viewer</h1>
      <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
        <a href="completeness.html" style="font-size: 0.85rem; padding: 0.45rem 1rem; border-radius: 9999px; background: #e1ebe6; color: #245c50; text-decoration: none; font-weight: 600;">Completeness</a>
        <a href="auth.html" style="font-size: 0.85rem; padding: 0.45rem 1rem; border-radius: 9999px; background: #f1f5f9; color: #475569; text-decoration: none; font-weight: 600; border: 1px solid #e2e8f0; transition: all 0.2s;" onmouseover="this.style.background='#e2e8f0'; this.style.color='#0f172a'" onmouseout="this.style.background='#f1f5f9'; this.style.color='#475569'">Authorization</a>
        <a href="latest.html" style="font-size: 0.85rem; padding: 0.45rem 1rem; border-radius: 9999px; background: #f1f5f9; color: #475569; text-decoration: none; font-weight: 600; border: 1px solid #e2e8f0; transition: all 0.2s;" onmouseover="this.style.background='#e2e8f0'; this.style.color='#0f172a'" onmouseout="this.style.background='#f1f5f9'; this.style.color='#475569'">Latest Entry</a>
      </div>
    </div>
    <p class="intro">Please enter a RESET ID and choose the information you want to see.</p>
    <div class="controls">
      <div class="control-row">
        <label for="res-id">RESET ID</label>
        <input id="res-id" name="res-id" type="text" placeholder="Enter RESET ID" />
      </div>
      <div class="control-row">
        <label for="target-field">Choose information</label>
        <select id="target-field" name="target-field">
          <option value="drug_info">Drug Information</option>
          <option value="medical_history">Medical History</option>
          <option value="biobank_collection">Biobank Collection</option>
        </select>
      </div>
      <button id="load-button" type="button">Load Data</button>
    </div>
    <section id="status" class="status"></section>
    <section id="results" class="results"></section>
  </main>
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
