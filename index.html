<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RESET Data Viewer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;">
      <h1 style="margin: 0;">RESET Data Viewer</h1>
      <a href="auth.html" style="font-size: 0.9rem; padding: 0.4rem 0.85rem; border-radius: 0.75rem; background: #2563eb; color: white; text-decoration: none; font-weight: 700; transition: background 0.2s;" onmouseover="this.style.background='#1d4ed8'" onmouseout="this.style.background='#2563eb'">Authorization Tool &rarr;</a>
    </div>
    <p class="intro">Please enter a RESET ID and choose the information you want to see.</p>
    <div class="controls">
      <div class="control-row">
        <label for="res-id">RESET ID</label>
        <input id="res-id" name="res-id" type="text" placeholder="Enter RESET ID" />
      </div>
      <div class="control-row">
        <label for="target-field">Choose information</label>
        <select id="target-field" name="target-field">
          <option value="drug_info">Drug Information</option>
          <option value="medical_history">Medical History</option>
        </select>
      </div>
      <button id="load-button" type="button">Load Data</button>
    </div>
    <section id="status" class="status"></section>
    <section id="results" class="results"></section>
  </main>
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
